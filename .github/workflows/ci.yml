name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-binutils
            make

      - name: Build
        run: make

      - name: Unit tests
        run: make test

      - name: XP compatibility check
        run: make check

      - uses: actions/upload-artifact@v4
        with:
          name: xp-trim-${{ github.sha }}
          path: build/xptrim*.exe
